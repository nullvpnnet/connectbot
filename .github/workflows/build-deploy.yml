name: Build & Deploy ConnectBot APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        required: true
        default: 'oss'
        type: choice
        options:
          - oss
          - google
          - both
      deploy:
        description: 'Deploy to tablet via ADB?'
        required: true
        default: false
        type: boolean
      tablet_ip:
        description: 'Tablet IP (for ADB wireless)'
        required: false
        default: '192.168.1.111'
        type: string

env:
  ANDROID_HOME: /opt/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  build:
    runs-on: [self-hosted, android]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup local.properties
        run: echo "sdk.dir=/opt/android-sdk" > local.properties

      - name: Build OSS Debug APK
        if: inputs.flavor == 'oss' || inputs.flavor == 'both'
        run: ./gradlew assembleOssDebug --no-daemon

      - name: Build Google Debug APK
        if: inputs.flavor == 'google' || inputs.flavor == 'both'
        run: ./gradlew assembleGoogleDebug --no-daemon

      - name: Upload OSS APK artifact
        if: inputs.flavor == 'oss' || inputs.flavor == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: connectbot-oss-debug
          path: app/build/outputs/apk/oss/debug/app-oss-debug.apk
          retention-days: 7

      - name: Upload Google APK artifact
        if: inputs.flavor == 'google' || inputs.flavor == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: connectbot-google-debug
          path: app/build/outputs/apk/google/debug/app-google-debug.apk
          retention-days: 7

      - name: Deploy OSS to tablet via ADB
        if: (inputs.flavor == 'oss' || inputs.flavor == 'both') && inputs.deploy
        run: |
          ADB=/opt/android-sdk/platform-tools/adb
          TABLET="${{ inputs.tablet_ip }}:5555"
          echo "Connecting to tablet at $TABLET..."
          $ADB connect $TABLET
          $ADB -s $TABLET install -r app/build/outputs/apk/oss/debug/app-oss-debug.apk
          echo "OSS APK deployed!"

      - name: Deploy Google to tablet via ADB
        if: (inputs.flavor == 'google' || inputs.flavor == 'both') && inputs.deploy
        run: |
          ADB=/opt/android-sdk/platform-tools/adb
          TABLET="${{ inputs.tablet_ip }}:5555"
          echo "Connecting to tablet at $TABLET..."
          $ADB connect $TABLET
          $ADB -s $TABLET install -r app/build/outputs/apk/google/debug/app-google-debug.apk
          echo "Google APK deployed!"

      - name: Copy APKs to shared location
        run: |
          mkdir -p /opt/nullvpnnet/apk-releases
          cp -v app/build/outputs/apk/*/debug/*.apk /opt/nullvpnnet/apk-releases/
          echo "APKs copied to /opt/nullvpnnet/apk-releases/"
