name: Build & Deploy ConnectBot

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        required: true
        default: 'oss'
        type: choice
        options:
          - oss
          - google
          - both
      deploy:
        description: 'Deploy to tablet via ADB tunnel?'
        required: true
        default: false
        type: boolean

env:
  ANDROID_HOME: /opt/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  ADB_HOST: 127.0.0.1
  ADB_PORT: 5038

jobs:
  build:
    runs-on: [self-hosted, android]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: echo "sdk.dir=/opt/android-sdk" > local.properties

      - name: Build OSS
        if: inputs.flavor == 'oss' || inputs.flavor == 'both'
        run: ./gradlew assembleOssDebug --no-daemon

      - name: Build Google
        if: inputs.flavor == 'google' || inputs.flavor == 'both'
        run: ./gradlew assembleGoogleDebug --no-daemon

      - name: List devices
        run: adb -H ${{ env.ADB_HOST }} -P ${{ env.ADB_PORT }} devices -l

      - name: Deploy OSS to tablet
        if: (inputs.flavor == 'oss' || inputs.flavor == 'both') && inputs.deploy
        run: |
          adb -H ${{ env.ADB_HOST }} -P ${{ env.ADB_PORT }} install -r             app/build/outputs/apk/oss/debug/app-oss-debug.apk

      - name: Deploy Google to tablet
        if: (inputs.flavor == 'google' || inputs.flavor == 'both') && inputs.deploy
        run: |
          adb -H ${{ env.ADB_HOST }} -P ${{ env.ADB_PORT }} install -r             app/build/outputs/apk/google/debug/app-google-debug.apk

      - name: Upload OSS APK
        if: inputs.flavor == 'oss' || inputs.flavor == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: connectbot-oss-debug
          path: app/build/outputs/apk/oss/debug/app-oss-debug.apk
          retention-days: 7

      - name: Upload Google APK
        if: inputs.flavor == 'google' || inputs.flavor == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: connectbot-google-debug
          path: app/build/outputs/apk/google/debug/app-google-debug.apk
          retention-days: 7

      - name: Copy to releases dir
        run: |
          mkdir -p /opt/nullvpnnet/apk-releases
          cp -v app/build/outputs/apk/*/debug/*.apk /opt/nullvpnnet/apk-releases/
