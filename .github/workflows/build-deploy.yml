name: Build & Deploy ConnectBot APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        required: true
        default: 'oss'
        type: choice
        options:
          - oss
          - google
          - both
      deploy:
        description: 'Deploy to tablet via ADB wireless?'
        required: true
        default: false
        type: boolean
      tablet_ip:
        description: 'Tablet IP for ADB wireless'
        required: false
        default: '192.168.1.111'
        type: string

env:
  ANDROID_HOME: /opt/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  build:
    runs-on: [self-hosted, android]
    steps:
      - uses: actions/checkout@v4
      - run: echo "sdk.dir=/opt/android-sdk" > local.properties

      - name: Build OSS
        if: inputs.flavor == 'oss' || inputs.flavor == 'both'
        run: ./gradlew assembleOssDebug --no-daemon

      - name: Build Google
        if: inputs.flavor == 'google' || inputs.flavor == 'both'
        run: ./gradlew assembleGoogleDebug --no-daemon

      - name: Upload OSS APK
        if: inputs.flavor == 'oss' || inputs.flavor == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: connectbot-oss-debug
          path: app/build/outputs/apk/oss/debug/app-oss-debug.apk
          retention-days: 7

      - name: Upload Google APK
        if: inputs.flavor == 'google' || inputs.flavor == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: connectbot-google-debug
          path: app/build/outputs/apk/google/debug/app-google-debug.apk
          retention-days: 7

      - name: Deploy to tablet
        if: inputs.deploy
        run: |
          ADB=/opt/android-sdk/platform-tools/adb
          $ADB connect ${{ inputs.tablet_ip }}:5555
          for apk in app/build/outputs/apk/*/debug/*.apk; do
            $ADB -s ${{ inputs.tablet_ip }}:5555 install -r "$apk"
          done

      - name: Copy to releases
        run: |
          mkdir -p /opt/nullvpnnet/apk-releases
          cp -v app/build/outputs/apk/*/debug/*.apk /opt/nullvpnnet/apk-releases/
